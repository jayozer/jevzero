[project]
name = "jevzero"
version = "0.1.0"
description = "A calmer Gmail inbox, powered by Jev's typed judgments."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.28,<1",
    "google-auth-oauthlib>=1.2,<2",
    "requests>=2.32,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "cryptography>=45,<51",
]

[project.scripts]
jevzero = "jevzero.local:main"
jevzero-legacy = "jevzero.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
